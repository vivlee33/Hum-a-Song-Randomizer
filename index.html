<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hum a Song Randomizer</title>
  <style>
    body {
      font-family: Chalkboard SE, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #EFD4BB;
    }
    .container {
      background: #FFF;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      text-align: center;
      border: 1px solid #F89999;
      /* Grid background */
      background-image:
      repeating-linear-gradient(#E3EAD9 0 1px, transparent 1px 20px),
      repeating-linear-gradient(90deg, #E3EAD9 0 1px, transparent 1px 20px);
      background-size: 20px 20px;
    }
    #result {
      border: 1px solid #8BA861;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      min-height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      background: #BDD69A;
      color: #FFF5D4;
      /* Drop shadow: 2pt offset (~2px), 5pt blur (~5px), 75% opacity, 270° (down), hex color #FE6347 */
      text-shadow: 0px 1px 2px rgba(254, 99, 71, 0.75);
    }
    button {
      font-family: Chalkboard SE, sans-serif;
      padding: 12px 24px;
      border: 1px solid #FE6347;
      border-radius: 10px;
      background: #F89999;
      color: white;
      font-size: 18px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }
    button:hover {
      background: #F86267;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="result">Click the button to randomize!</div>
    <button onclick="randomize()">Randomize</button>
  </div>

  <script>
    const items = [
      "Bohemian Rhapsody — Queen",
      "Billie Jean — Michael Jackson",
      "Toxic — Britney Spears",
      "Call Me Maybe — Carly Rae Jepsen",
      "Gangnam Style — PSY",
      "I Just Can’t Wait to Be King — The Lion King",
      "Remember Me — Coco",
      "Into the Unknown — Frozen",
      "Gaston — Beauty and the Beast",
      "Sweet Caroline — Neil Diamond",
      "Livin’ on a Prayer — Bon Jovi",
      "Uptown Funk — Mark Ronson ft. Bruno Mars",
      "Rolling in the Deep — Adele",
      "Shake It Off — Taylor Swift",
      "Eye of the Tiger — Survivor",
      "Let It Go — Frozen",
      "A Whole New World — Aladdin",
      "Under the Sea — The Little Mermaid",
      "You’ve Got a Friend in Me — Toy Story",
      "Hakuna Matata — The Lion King",
      "Part of Your World — The Little Mermaid",
      "Be Our Guest — Beauty and the Beast",
      "I Wan’na Be Like You — The Jungle Book",
      "Friend Like Me — Aladdin",
      "Circle of Life — The Lion King",
      "Baby Shark — Pinkfong",
      "Never Gonna Give You Up — Rick Astley",
      "Macarena — Los del Rio",
      "Who Let the Dogs Out — Baha Men",
      "The Gummy Bear Song — Gummibär",
      "Old Town Road — Lil Nas X",
      "Barbie Girl — Aqua",
      "Happy — Pharrell Williams",
      "Can’t Stop the Feeling — Justin Timberlake",
    ];

    function randomize() {
      const randomPick = items[Math.floor(Math.random() * items.length)];
      document.getElementById("result").textContent = randomPick;
    }
  </script>
</body>
</html>
